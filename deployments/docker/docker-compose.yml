name: gokkalkan

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gokkalkan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gokkalkan}
      POSTGRES_DB: ${POSTGRES_DB:-gokkalkan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gokkalkan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Okuma API'si (/healthz, /api/v1/alerts, /api/v1/receipts) HTTP_ADDR'de;
  # agent egress proxy (internal/gateway) ayri PROXY_ADDR'de dinler (ayni
  # mux'ta path/host celismesi olurdu — bkz. internal/gateway paket yorumu).
  # RECEIPT_SEED_HEX zorunlu: imzalama anahtari olmadan hicbir dis cagri
  # degerlendirilemez (mediator fail-closed disiplini). Buradaki deger
  # SADECE yerel/demo amaclidir, production'da secret olarak enjekte edilir.
  gokkalkan:
    build:
      context: ../../
      dockerfile: deployments/docker/gokkalkan.Dockerfile
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-gokkalkan}:${POSTGRES_PASSWORD:-gokkalkan}@postgres:5432/${POSTGRES_DB:-gokkalkan}?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: ":8090"
      PROXY_ADDR: ":8091"
      RECEIPT_SEED_HEX: ${RECEIPT_SEED_HEX:-0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20}
    ports:
      - "8090:8090"
      - "8091:8091"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/gokkalkan", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
