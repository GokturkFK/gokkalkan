name: gokkalkan

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gokkalkan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gokkalkan}
      POSTGRES_DB: ${POSTGRES_DB:-gokkalkan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gokkalkan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # GKO-1 iskeleti: sadece boot + /healthz. Proxy/enforcement mantigi (GK-A,
  # GK-B) geldikce bu servis onlarin uzerine oturacak; simdilik yalnizca
  # altyapinin (nats+postgres) uzerine saglikli bir bos binary ayaga kalkiyor.
  gokkalkan:
    build:
      context: ../../
      dockerfile: deployments/docker/gokkalkan.Dockerfile
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-gokkalkan}:${POSTGRES_PASSWORD:-gokkalkan}@postgres:5432/${POSTGRES_DB:-gokkalkan}?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: ":8090"
    ports:
      - "8090:8090"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/gokkalkan", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
